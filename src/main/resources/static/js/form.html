<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>마이페이지 - Foody</title>
</head>
<body>
<header class="top">
    <div class="top-inner">
        <h1>마이페이지</h1>
        <div class="sub">내 리뷰 관리</div>
    </div>
</header>

<div class="layout">
    <!-- FR-08 내 정보 -->
    <div class="profile">
        <div id="welcome" class="who"></div>
        <button class="btn-quiet" id="toggleEdit" aria-expanded="false" aria-controls="editPanel">내 정보 수정</button>
    </div>

    <div id="editPanel" hidden>
        <div class="panel">
            <h2>닉네임</h2>
            <div class="user-id">아이디 <b id="userId"></b></div>
            <label>닉네임 (20자 이하)
                <input id="nickname" maxlength="20">
            </label>
            <button class="btn" id="saveNickname">닉네임 저장</button>
            <div id="nicknameMsg" class="msg"></div>
        </div>

        <div class="panel">
            <h2>비밀번호</h2>
            <label>현재 비밀번호
                <input id="currentPassword" type="password" autocomplete="current-password">
            </label>
            <label>새 비밀번호 (8자 이상)
                <input id="newPassword" type="password" autocomplete="new-password">
            </label>
            <button class="btn" id="savePassword">비밀번호 변경</button>
            <div id="passwordMsg" class="msg"></div>
        </div>
    </div>

    <!-- FR-09 내 리뷰 관리 -->
    <h2 class="list-title">내가 쓴 리뷰</h2>
    <div id="reviews"></div>
    <div id="reviewMsg" class="msg"></div>
</div>

<script>
    // ===== 설정 (여기만 고치면 됨) =====
    const API = {
        me:        '/api/members/me',
        myReviews: '/api/members/me/reviews',
        review:    (id) => `/api/members/me/reviews/${id}`
    };

    // TODO: 로그인(토큰) 완성되면 X-Member-Id 대신 Authorization 헤더로 교체
    function authHeaders() {
        return {
            'X-Member-Id': localStorage.getItem('memberId') || '1',
            'Content-Type': 'application/json'
        };
    }

    // ===== 공통 =====
    async function request(method, url, body) {
        const res = await fetch(url, {
            method,
            headers: authHeaders(),
            body: body ? JSON.stringify(body) : undefined
        });
        let data = null;
        const text = await res.text();
        try { data = text ? JSON.parse(text) : null; } catch (e) { /* 본문이 JSON이 아니면 무시 */ }
        if (!res.ok) {
            const message = (data && data.message) || `요청에 실패했어요. (${res.status})`;
            throw new Error(message);
        }
        return data;
    }

    function show(el, text, ok) {
        el.textContent = text;
        el.className = 'msg ' + (ok ? 'ok' : 'err');
    }

    const $ = (id) => document.getElementById(id);

    // ===== 내 정보 =====
    async function loadMe() {
        try {
            const me = await request('GET', API.me);
            $('userId').textContent = me.userId;
            $('nickname').value = me.nickname;
            $('welcome').textContent = `${me.nickname} 님 (${me.userId})`;
        } catch (e) {
            $('welcome').textContent = e.message;
        }
    }

    $('saveNickname').addEventListener('click', async () => {
        try {
            const me = await request('PATCH', API.me, { nickname: $('nickname').value });
            $('welcome').textContent = `${me.nickname} 님 (${me.userId})`;
            show($('nicknameMsg'), '닉네임이 저장됐어요.', true);
        } catch (e) {
            show($('nicknameMsg'), e.message, false);
        }
    });

    $('savePassword').addEventListener('click', async () => {
        try {
            await request('PATCH', API.me, {
                currentPassword: $('currentPassword').value,
                newPassword: $('newPassword').value
            });
            $('currentPassword').value = '';
            $('newPassword').value = '';
            show($('passwordMsg'), '비밀번호가 변경됐어요.', true);
        } catch (e) {
            show($('passwordMsg'), e.message, false);
        }
    });

    $('toggleEdit').addEventListener('click', () => {
        const panel = $('editPanel');
        panel.hidden = !panel.hidden;
        $('toggleEdit').setAttribute('aria-expanded', String(!panel.hidden));
    });

    // ===== 내 리뷰 =====
    async function loadReviews() {
        const box = $('reviews');
        box.textContent = '';
        try {
            const list = await request('GET', API.myReviews);
            if (!list || list.length === 0) {
                const p = document.createElement('div');
                p.className = 'empty';
                p.textContent = '작성한 리뷰가 없어요. 가게 상세 페이지에서 첫 리뷰를 남겨 보세요.';
                box.appendChild(p);
                return;
            }
            list.forEach(r => box.appendChild(renderReview(r)));
        } catch (e) {
            show($('reviewMsg'), e.message, false);
        }
    }

    function renderReview(r) {
        const wrap = document.createElement('div');
        wrap.className = 'review';

        const head = document.createElement('div');
        head.className = 'review-head';

        const link = document.createElement('a');
        link.className = 'shop';
        link.href = `/food.html?id=${r.shopId}`;
        link.textContent = r.shopName;

        const stars = document.createElement('span');
        stars.className = 'stars';
        stars.setAttribute('aria-hidden', 'true');
        stars.textContent = '★'.repeat(r.rating) + '☆'.repeat(Math.max(0, 5 - r.rating));

        const score = document.createElement('span');
        score.className = 'score';
        score.textContent = `${r.rating}점`;

        head.append(link, stars, score);

        const content = document.createElement('p');
        content.className = 'review-body';
        content.textContent = r.content;   // textContent라서 HTML이 실행되지 않음

        const meta = document.createElement('div');
        meta.className = 'meta';
        meta.textContent = `수정 ${(r.updatedAt || '').replace('T', ' ').slice(0, 16)}`;

        const actions = document.createElement('div');
        actions.className = 'review-actions';

        const editBtn = document.createElement('button');
        editBtn.className = 'btn-quiet';
        editBtn.textContent = '수정';
        editBtn.addEventListener('click', () => editReview(r));

        const delBtn = document.createElement('button');
        delBtn.className = 'btn-quiet danger';
        delBtn.textContent = '🗑 삭제';
        delBtn.addEventListener('click', () => deleteReview(r));

        actions.append(editBtn, delBtn);
        wrap.append(head, content, meta, actions);
        return wrap;
    }

    async function editReview(r) {
        const content = prompt('리뷰 내용을 수정하세요.', r.content);
        if (content === null) return;                        // 취소
        const ratingText = prompt('별점을 입력하세요. (1~5)', r.rating);
        if (ratingText === null) return;
        const rating = Number(ratingText);
        if (!Number.isInteger(rating) || rating < 1 || rating > 5) {
            show($('reviewMsg'), '별점은 1~5 사이의 정수여야 해요.', false);
            return;
        }
        try {
            await request('PATCH', API.review(r.reviewId), { rating, content });
            show($('reviewMsg'), '리뷰를 수정했어요.', true);
            loadReviews();
        } catch (e) {
            show($('reviewMsg'), e.message, false);
        }
    }

    async function deleteReview(r) {
        if (!confirm(`'${r.shopName}' 리뷰를 삭제할까요?`)) return;
        try {
            await request('DELETE', API.review(r.reviewId));
            show($('reviewMsg'), '리뷰를 삭제했어요.', true);
            loadReviews();
        } catch (e) {
            show($('reviewMsg'), e.message, false);
        }
    }

    // 시작
    loadMe();
    loadReviews();
</script>
</body>
</html>
