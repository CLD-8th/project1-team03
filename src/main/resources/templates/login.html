<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FOODY - 로그인</title>

    <link rel="stylesheet" href="/login.css">
</head>

<body>

<header class="header">
    <div class="header-inner">

        <a href="/shops" class="logo">
            FOODY
        </a>

        <nav class="nav">
            <a href="/shops">맛집 찾기</a>
            <a href="/signup">회원가입</a>
        </nav>

    </div>
</header>


<main class="login-page">

    <section class="login-container">

        <div class="login-heading">
            <p class="eyebrow">WELCOME BACK</p>

            <h1>로그인</h1>

            <p>
                FOODY에서 나만의 맛집을 찾아보세요.
            </p>
        </div>


        <form id="loginForm" class="login-form">

            <div class="form-group">
                <label for="userId">
                    아이디
                </label>

                <input
                        type="text"
                        id="userId"
                        name="userId"
                        placeholder="아이디를 입력하세요"
                        autocomplete="username"
                        required
                >
            </div>


            <div class="form-group">
                <label for="password">
                    비밀번호
                </label>

                <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="비밀번호를 입력하세요"
                        autocomplete="current-password"
                        required
                >
            </div>


            <p
                    id="errorMessage"
                    class="error-message">
            </p>


            <button
                    type="submit"
                    id="loginButton"
                    class="login-button">

                로그인

            </button>

        </form>


        <div class="signup-guide">

            <span>
                아직 계정이 없나요?
            </span>

            <a href="/signup">
                회원가입
            </a>

        </div>

    </section>

</main>


<script src="/js/login.js"></script>

</body>
</html>
